name: Sync upstream main

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'crims0n/muse-gadget-core2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward main to upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags https://github.com/facebookincubator/muse-gadget-sdk.git main:refs/remotes/upstream/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/upstream/main; then
            echo "::error::main has diverged from upstream; refusing to overwrite it."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
